[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmua-paper-converter"
version = "0.1.0"
description = "Convert exam paper PDFs (and scans/photos) into .tmua.json files for a TMUA exam simulator - offline, no AI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "pillow>=10",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Headless-browser KaTeX check: every converted expression must render.
render = ["playwright>=1.44"]
dev = ["pytest>=8", "playwright>=1.44", "httpx>=0.27"]

[project.scripts]
tmua-convert = "tmua_converter.cli:convert_main"
tmua-validate = "tmua_converter.cli:validate_main"
tmua-app = "tmua_converter.web.app:main"

[tool.setuptools.packages.find]
include = ["tmua_converter*"]

[tool.setuptools.package-data]
tmua_converter = ["web/static/*", "web/static/**/*", "render_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
